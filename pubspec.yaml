name: efood_table_booking
description: A new Flutter application.
publish_to: 'none' #
version: 1.0.0+0

environment:
  sdk: ^3.8.1


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  connectivity_plus: ^7.0.0
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  path_provider: ^2.1.5
  url_strategy: ^0.3.0
  image_picker: ^1.2.0
  cached_network_image: ^3.4.1
  lottie: ^3.3.2
  flutter_custom_clippers: ^2.1.0
  youtube_player_flutter: ^9.1.3
  carousel_slider: ^5.1.1
  shimmer: ^3.0.0
  fluttertoast: ^9.0.0
  getwidget: ^7.0.0
  expandable_text: ^2.3.0
  http: ^1.5.0
  photo_view: ^0.15.0
  flutter_svg: ^2.2.1
  url_launcher: ^6.3.2


dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter


flutter:
  uses-material-design: true

  assets:
    - assets/image/
    - assets/language/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/font/Roboto-Regular.ttf
          weight: 400
        - asset: assets/font/Roboto-Medium.ttf
          weight: 500
        - asset: assets/font/Roboto-Bold.ttf
          weight: 700
        - asset: assets/font/Roboto-Black.ttf
          weight: 900